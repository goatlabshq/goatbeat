site_name: Goatbeat
site_description: A type-safe, distributed periodic task scheduler for Python and Django Tasks.
repo_url: https://github.com/goatlabshq/goatbeat
site_url: https://goatlabshq.github.io/goatbeat/
repo_name: goatlabshq/goatbeat
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        Goatbeat is a type-safe, distributed periodic task scheduler for Python. It decides what
        is due, coordinates several scheduler instances through a fenced lease stored in
        PostgreSQL, claims each occurrence at most once and submits it to Django 6.1 Tasks,
        Celery, Dramatiq or RQ, which run it. The core is framework-independent. Python 3.13 or
        newer is required. Install with `pip install "goatbeat[postgres]" "psycopg[binary]"` or
        `pip install "goatbeat[django]" "psycopg[binary]"` (also `[celery]`, `[dramatiq]`,
        `[rq]`, `[prometheus]`, `[otel]`).
      sections:
        Getting started:
          - index.md
          - quickstart.md
          - typed-tasks.md
          - scheduling.md
          - misfire.md
          - timezones.md
        Django:
          - django.md
          - django-tasks.md
          - migration.md
        Distributed operation:
          - architecture.md
          - locking.md
          - failover.md
          - multiple-schedulers.md
          - multiple-workers.md
          - distributed-deployment.md
        Operations:
          - postgresql.md
          - production.md
          - observability.md
          - performance.md
          - security.md
          - troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: quickstart.md
      - Type-safe task definitions: typed-tasks.md
      - Scheduling: scheduling.md
      - Misfire policies: misfire.md
      - Timezones: timezones.md
  - Django:
      - Django 6.1 integration: django.md
      - Django Tasks integration: django-tasks.md
      - Migration from django-celery-beat: migration.md
  - Distributed operation:
      - Architecture: architecture.md
      - Locking: locking.md
      - Failover: failover.md
      - Multiple scheduler instances: multiple-schedulers.md
      - Multiple workers: multiple-workers.md
      - Distributed deployment: distributed-deployment.md
  - Operations:
      - PostgreSQL setup: postgresql.md
      - Production deployment: production.md
      - Observability: observability.md
      - Performance: performance.md
      - Security: security.md
      - Troubleshooting: troubleshooting.md

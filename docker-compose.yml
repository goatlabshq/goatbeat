services:
  postgres:
    image: ${GOATBEAT_POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: goatbeat
      POSTGRES_PASSWORD: goatbeat
      POSTGRES_DB: goatbeat
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goatbeat"]
      interval: 1s
      timeout: 3s
      retries: 30

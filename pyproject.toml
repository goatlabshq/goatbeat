[project]
name = "goatbeat-workspace"
version = "0.2.0"
description = "Development workspace for the Goatbeat packages."
readme = "README.md"
license = "MIT"
authors = [{ name = "Louis Midson LAJEANTY", email = "midsonlajeanty@proton.me" }]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "goatbeat",
    "goatbeat-core",
    "goatbeat-postgres",
    "goatbeat-django",
    "goatbeat-celery",
    "goatbeat-dramatiq",
    "goatbeat-rq",
    "goatbeat-prometheus",
    "goatbeat-otel",
    "goatbeat-cli",
    "celery-types>=0.26",
    "fakeredis>=2.39",
    "opentelemetry-sdk>=1.45",
    "croniter>=6.2",
    "django-stubs>=6.1.2",
    "hypothesis>=6.168",
    "lefthook>=2.2",
    "pyright[nodejs]>=1.1.414",
    "psycopg[binary]>=3.3",
    "pytest>=9.1",
    "pytest-django>=4.14",
    "ruff>=0.16",
    "twine>=7.0",
    "types-croniter>=6.2",
]
docs = [
    "mkdocs-llmstxt>=0.5.1",
    "mkdocs-material>=9.7",
]

[tool.uv]
package = false
exclude-newer = "7 days"
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
goatbeat = { workspace = true }
goatbeat-core = { workspace = true }
goatbeat-postgres = { workspace = true }
goatbeat-django = { workspace = true }
goatbeat-celery = { workspace = true }
goatbeat-dramatiq = { workspace = true }
goatbeat-rq = { workspace = true }
goatbeat-prometheus = { workspace = true }
goatbeat-otel = { workspace = true }
goatbeat-cli = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100
force-exclude = true
extend-exclude = [".typecheck", "tests/typing/fixtures", "legacy", "docs/superpowers", "**/migrations"]

[tool.ruff.lint]
select = [
    "A", "ARG", "B", "C4", "DTZ", "E", "F", "FA", "FBT", "I", "ISC", "N", "PGH", "PIE",
    "PL", "PT", "PTH", "PYI", "RET", "RUF", "S", "SIM", "T20", "TC", "TID", "UP", "W",
]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLC0415", "FBT003"]
"scripts/**" = ["S101", "T201"]
"tests/performance/**" = ["S101", "T201"]
"**/goatbeat/core/testing/conformance.py" = ["S101"]
# SQL text only interpolates column lists from module constants; values are always bound.
"**/goatbeat/core/stores/sqlite.py" = ["S608"]
# Queries are typed LiteralString, so pyright rejects any SQL built from runtime values.
"**/goatbeat/postgres/store.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["goatbeat"]
known-third-party = ["django"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = [".typecheck"]
include = ["packages", "tests", "scripts"]
exclude = ["**/__pycache__", "tests/typing/fixtures", "**/.venv", "legacy", "**/migrations"]
reportMissingModuleSource = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers", "--strict-config", "-m", "not distributed and not performance"]
markers = [
    "distributed: multi-process and failure-injection tests against PostgreSQL",
    "performance: large-volume benchmarks against PostgreSQL",
]
testpaths = ["packages", "tests"]
filterwarnings = ["error"]

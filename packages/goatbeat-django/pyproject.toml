[project]
name = "goatbeat-django"
version = "0.2.0" # x-release-please-version
description = "Django 6.1 integration for Goatbeat: models, admin, management command and Django Tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louis Midson LAJEANTY", email = "midsonlajeanty@proton.me" }]
requires-python = ">=3.13"
keywords = ["scheduler", "cron", "periodic-tasks", "distributed", "django-tasks", "leader-election"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "goatbeat-core==0.2.0", # x-release-please-version
    "goatbeat-postgres==0.2.0", # x-release-please-version
    "django>=6.1",
]

[project.urls]
Homepage = "https://github.com/goatlabshq/goatbeat"
Documentation = "https://goatlabshq.github.io/goatbeat/"
Issues = "https://github.com/goatlabshq/goatbeat/issues"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "goatbeat.django"

[tool.uv.sources]
goatbeat-core = { workspace = true }
goatbeat-postgres = { workspace = true }

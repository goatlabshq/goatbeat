[project]
name = "goatbeat"
version = "0.1.0" # x-release-please-version
description = "A type-safe, distributed periodic task scheduler for Python and Django Tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Louis Midson LAJEANTY", email = "midsonlajeanty@proton.me" }]
requires-python = ">=3.13"
keywords = ["scheduler", "cron", "periodic-tasks", "distributed", "django-tasks", "leader-election"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "goatbeat-core==0.1.0", # x-release-please-version
    "goatbeat-cli==0.1.0", # x-release-please-version
]

[project.optional-dependencies]
postgres = ["goatbeat-postgres==0.1.0"] # x-release-please-version
django = ["goatbeat-django==0.1.0"] # x-release-please-version
celery = ["goatbeat-celery==0.1.0"] # x-release-please-version
dramatiq = ["goatbeat-dramatiq==0.1.0"] # x-release-please-version
rq = ["goatbeat-rq==0.1.0"] # x-release-please-version
prometheus = ["goatbeat-prometheus==0.1.0"] # x-release-please-version
otel = ["goatbeat-otel==0.1.0"] # x-release-please-version

[project.urls]
Homepage = "https://github.com/goatlabshq/goatbeat"
Documentation = "https://goatlabshq.github.io/goatbeat/"
Issues = "https://github.com/goatlabshq/goatbeat/issues"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "goatbeat"

[tool.uv.sources]
goatbeat-core = { workspace = true }
goatbeat-postgres = { workspace = true }
goatbeat-django = { workspace = true }
goatbeat-cli = { workspace = true }
goatbeat-celery = { workspace = true }
goatbeat-dramatiq = { workspace = true }
goatbeat-rq = { workspace = true }
goatbeat-prometheus = { workspace = true }
goatbeat-otel = { workspace = true }
